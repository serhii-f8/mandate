# Operations defined in configuration. The catalog operations come from the preset bound in
# connections.yaml; support.lookup_order is an explicit mapping on the same connection.
version: 1
operations:
  - id: support.lookup_order
    connection: magento
    risk: read
    description: Look up an order by its number.
    upstream:
      method: GET
      path: /V1/orders
      query:
        searchCriteria[filter_groups][0][filters][0][field]: increment_id
        searchCriteria[filter_groups][0][filters][0][value]: { arg: order_number }
        searchCriteria[filter_groups][0][filters][0][condition_type]: eq
      response: { items: items, total: total_count }
    input_schema:
      type: object
      properties: { order_number: { type: string, minLength: 1 } }
      required: [order_number]
      additionalProperties: false
