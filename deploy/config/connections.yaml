# Development configuration (design §7). Connection magento points at a placeholder shop
# and applies the Magento catalog preset (presets/magento2-catalog), which brings
# catalog.search_products, catalog.get_product, catalog.get_products_by_sku, catalog.update_content and the connection test. Its credential is
# entered on the trusted credential page (UI-5); until then allowed calls end in the fixed
# "credential has not been entered" result. The api loads the preset from MANDATE_PRESET_DIRS;
# check this directory with `pnpm mandate validate deploy/config --preset-dir presets`.
version: 1
presets:
  - { id: magento-catalog, package: '@mandate/magento2-catalog', version: '1.0.0' }
connections:
  - id: magento
    adapter: openapi
    base_url: https://shop.example.test/rest/all
    credential_ref: magento-integration
    auth: { scheme: bearer }
    preset: magento-catalog
    # Development only: lets the connection reach a shop on a private or loopback address
    # (a local sandbox). Leave it out, or false, in production (CONN-5).
    allow_private_network: true
