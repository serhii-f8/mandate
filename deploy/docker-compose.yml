# AI Operations Layer — standard installation (NFR-9, ADR 0012).
# Start from the repository root with one command:   docker compose up -d --wait
# Every value below has a development default equal to .env.example. All defaults
# are development-only fakes; a `.env` in the repository root overrides them.
# Host ports bind to 127.0.0.1 only. The MCP endpoint requires a Keycloak token
# (Phase 2); the development users have visibly fake passwords.

x-temporal-db: &temporal-db
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: temporal
  POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-dev-only-temporal-db-password}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-dev-only-postgres-password}
      AIOPS_DB_PASSWORD: ${AIOPS_DB_PASSWORD:-dev-only-aiops-db-password}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-dev-only-temporal-db-password}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-only-keycloak-db-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-aiops-init.sh:ro
    ports:
      - "127.0.0.1:${AIOPS_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      # Over TCP: during first-time init the temporary server listens on the socket
      # only, so this stays unhealthy until init.sh has created roles and databases.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      postgres:
        condition: service_healthy
    environment: *temporal-db
    volumes:
      - ./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    restart: "no"

  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:${AIOPS_TEMPORAL_PORT:-17233}:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --health-enabled=true
      # Experimental features needed for MCP 2026-07-28 (ADR 0004).
      - --features=cimd,resource-indicators
      - --hostname=${AIOPS_KEYCLOAK_PUBLIC_URL:-http://localhost:8480}
      - --db=postgres
      - --db-url=jdbc:postgresql://postgres:5432/keycloak
      - --db-username=keycloak
      - --db-password=${KEYCLOAK_DB_PASSWORD:-dev-only-keycloak-db-password}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-keycloak-admin-password}
      # Placeholder inside the realm file: the audience of MCP access tokens.
      MCP_RESOURCE: ${AIOPS_MCP_RESOURCE:-http://localhost:8400/mcp}
      # Placeholders of the aiops-web page client: its secret and the api's public origin (ADR 0019).
      AIOPS_WEB_CLIENT_SECRET: ${AIOPS_WEB_CLIENT_SECRET:-dev-only-web-client-secret}
      AIOPS_PUBLIC_URL: ${AIOPS_PUBLIC_URL:-http://localhost:8400}
    volumes:
      - ./keycloak/realm-aiops.json:/opt/keycloak/data/import/realm-aiops.json:ro
    ports:
      - "127.0.0.1:${AIOPS_KEYCLOAK_PORT:-8480}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  # Realm settings a realm import cannot toggle: PKCE for every client, CIMD, DCR switch (AUTH-8, ADR 0014).
  keycloak-setup:
    image: node:22-bookworm-slim
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-keycloak-admin-password}
      AIOPS_MCP_RESOURCE: ${AIOPS_MCP_RESOURCE:-http://localhost:8400/mcp}
      AIOPS_CIMD_CLIENT_DOMAINS: ${AIOPS_CIMD_CLIENT_DOMAINS:-claude.ai}
      AIOPS_CIMD_EXTRA_DOMAINS: ${AIOPS_CIMD_EXTRA_DOMAINS:-localhost,127.0.0.1}
      AIOPS_DCR: ${AIOPS_DCR:-off}
      AIOPS_DCR_REDIRECT_HOSTS: ${AIOPS_DCR_REDIRECT_HOSTS:-claude.ai,chatgpt.com,localhost,127.0.0.1}
      # Service-account clients (AUTH-4); `-` not `:-`, so an empty value creates none.
      AIOPS_KEYCLOAK_SERVICE_ACCOUNTS: ${AIOPS_KEYCLOAK_SERVICE_ACCOUNTS-aiops-sa-ci}
    volumes:
      - ./keycloak/bootstrap.mjs:/scripts/bootstrap.mjs:ro
    entrypoint: ["node", "/scripts/bootstrap.mjs"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    image: aiops-api:local
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
      # The api starts with a lazy Temporal connection (ADR 0029); waiting here only spares the
      # first change-set of a fresh installation a failed start.
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://aiops:${AIOPS_DB_PASSWORD:-dev-only-aiops-db-password}@postgres:5432/aiops
      API_PORT: "8080"
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-localhost,127.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AIOPS_CONFIG_DIR: /etc/aiops/config
      AIOPS_MCP_RESOURCE: ${AIOPS_MCP_RESOURCE:-http://localhost:8400/mcp}
      # Tokens carry the public issuer; keys are fetched on the internal network (ADR 0014).
      OIDC_ISSUER: ${AIOPS_KEYCLOAK_PUBLIC_URL:-http://localhost:8480}/realms/aiops
      OIDC_JWKS_URL: http://keycloak:8080/realms/aiops/protocol/openid-connect/certs
      # Trusted-page login, credential vault keys (development-only defaults).
      AIOPS_PUBLIC_URL: ${AIOPS_PUBLIC_URL:-http://localhost:8400}
      OIDC_WEB_CLIENT_SECRET: ${AIOPS_WEB_CLIENT_SECRET:-dev-only-web-client-secret}
      OIDC_TOKEN_URL: http://keycloak:8080/realms/aiops/protocol/openid-connect/token
      AIOPS_MASTER_KEYS: ${AIOPS_MASTER_KEYS:-1:ZGV2LW9ubHktbWFzdGVyLWtleS0wMTIzNDU2Nzg5YWI=}
      AIOPS_SESSION_MAX_AGE_SECONDS: ${AIOPS_SESSION_MAX_AGE_SECONDS:-28800}
      AIOPS_FRESH_AUTH_SECONDS: ${AIOPS_FRESH_AUTH_SECONDS:-300}
      # Built into the image: the trusted pages' bundle, the widget bundles and the shipped presets (CONN-8).
      AIOPS_WEB_DIR: /app/web
      AIOPS_WIDGET_DIR: /app/widgets
      AIOPS_PRESET_DIRS: /app/presets
      # Execution on Temporal (EXE-11): the same frontend, namespace, task queue and payload keys
      # (SEC-4, development-only default) as the worker.
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-aiops-operations}
      AIOPS_TEMPORAL_KEYS: ${AIOPS_TEMPORAL_KEYS:-1:ZGV2LW9ubHktdGVtcG9yYWwta2V5LTAxMjM0NTY3ODk=}
      # How long a write call without Tasks waits for its preparation (MCP-7).
      AIOPS_PREPARE_WAIT_MS: ${AIOPS_PREPARE_WAIT_MS:-20000}
      # Audit archive files written by retention and read by `aiops audit verify --archive` (AUD-7).
      AIOPS_AUDIT_ARCHIVE_DIR: /var/lib/aiops/audit-archive
      # Traces (NFR-11): empty means no export; with `--profile observability` set http://jaeger:4318.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Prometheus text on GET /metrics (NFR-12); not published, scraped on the internal network.
      AIOPS_METRICS_PORT: "9464"
    volumes:
      - ./config:/etc/aiops/config:ro
      - audit-archive:/var/lib/aiops/audit-archive
    ports:
      - "127.0.0.1:${AIOPS_API_PORT:-8400}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    image: aiops-worker:local
    depends_on:
      postgres:
        condition: service_healthy
      # The worker refuses an unmigrated schema; api applies the migrations before it is healthy (NFR-5).
      api:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-aiops-operations}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://aiops:${AIOPS_DB_PASSWORD:-dev-only-aiops-db-password}@postgres:5432/aiops
      # The same configuration and presets as api (CFG-1, CONN-8); the presets are built into the image.
      AIOPS_CONFIG_DIR: /etc/aiops/config
      AIOPS_PRESET_DIRS: /app/presets
      AIOPS_MASTER_KEYS: ${AIOPS_MASTER_KEYS:-1:ZGV2LW9ubHktbWFzdGVyLWtleS0wMTIzNDU2Nzg5YWI=}
      # Temporal payload encryption keys (SEC-4), development-only default. Activity tuning
      # (AIOPS_PREPARE_TIMEOUT_MS, AIOPS_BATCH_*, AIOPS_RETRY_*) keeps its built-in defaults unless set here with a value.
      AIOPS_TEMPORAL_KEYS: ${AIOPS_TEMPORAL_KEYS:-1:ZGV2LW9ubHktdGVtcG9yYWwta2V5LTAxMjM0NTY3ODk=}
      # Notification delivery (NTF-1, NTF-3). The development relay is Mailpit; no depends_on on it,
      # because a notification channel that is down must not stop the worker.
      AIOPS_SMTP_URL: ${AIOPS_SMTP_URL:-smtp://mailpit:1025}
      AIOPS_MAIL_FROM: ${AIOPS_MAIL_FROM:-aiops@example.test}
      AIOPS_PUBLIC_URL: ${AIOPS_PUBLIC_URL:-http://localhost:8400}
      # Audit retention archives the sealed prefix here before deleting it (AUD-7).
      AIOPS_AUDIT_ARCHIVE_DIR: /var/lib/aiops/audit-archive
      # Traces (NFR-11), as for api: empty means no export.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # /healthz, /readyz and /metrics (NFR-10, NFR-12); not published.
      AIOPS_WORKER_HTTP_PORT: "8081"
    volumes:
      - ./config:/etc/aiops/config:ro
      - audit-archive:/var/lib/aiops/audit-archive
    # Ready means database, configuration and a polling Temporal worker (NFR-10). The path is matched
    # exactly by the worker, so no query string.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  # Development SMTP sink only (NTF-1): catches every notification e-mail; the web UI and API
  # listen on 8025. Point AIOPS_SMTP_URL at a real relay in production.
  mailpit:
    image: axllent/mailpit:v1.29.0
    ports:
      - "127.0.0.1:${AIOPS_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # Optional trace backend (NFR-11), only with `--profile observability` (or COMPOSE_PROFILES).
  # The UI is published on 127.0.0.1; OTLP (4318) stays on the internal network. Set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 so api and worker export to it.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${AIOPS_JAEGER_PORT:-16686}:16686"
    restart: unless-stopped

volumes:
  postgres-data:
  audit-archive:
