version: 1
changesets:
  expire_after_hours: 72
operations:
  - id: shop.get_products
    connection: shop
    risk: read
    description: Products by SKU.
    upstream:
      method: GET
      path: /V1/products
      query: { skus: { arg: skus, join: ',' }, brand: { arg: brand } }
      response: { items: items, total: total_count, fields_from_arg: fields }
    input_schema:
      type: object
      properties:
        skus: { type: array, items: { type: string } }
        brand: { type: string }
        fields: { type: array, items: { type: string } }
      required: [skus, fields]
      additionalProperties: false
    fields_arg: fields
  - id: shop.search_products
    connection: shop
    risk: read
    description: Search products by brand, page by page.
    upstream:
      method: GET
      path: /V1/products/search
      query: { brand: { arg: brand }, page: { arg: page }, page_size: { arg: page_size } }
      response: { items: items, total: total_count, fields_from_arg: fields }
    input_schema:
      type: object
      properties:
        brand: { type: string }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        fields: { type: array, items: { type: string } }
      required: [fields]
      additionalProperties: false
    fields_arg: fields
  - id: shop.update_content
    connection: shop
    risk: write
    title: Update product content
    description: Change product names and descriptions.
    upstream: { method: POST, path: /V1/products/bulk }
    input_schema:
      type: object
      properties:
        brand: { type: string }
        skus: { type: array, items: { type: string } }
        changes:
          type: object
          properties: { name: { type: string }, description: { type: string } }
          additionalProperties: false
          minProperties: 1
      required: [brand, changes]
      additionalProperties: false
    manifest:
      id_field: sku
      ids_arg: skus
      values_arg: changes
      fields: [name, description]
      scope_args: { brand: brand }
      read_before:
        operation: shop.get_products
        ids_arg: skus
        args: { brand: { arg: brand } }
      selector:
        operation: shop.search_products
        args: { brand: { arg: brand } }
        page_arg: page
        page_size_arg: page_size
      rollback: { strategy: replay_previous_state }
  - id: shop.retire_content
    connection: shop
    risk: destructive
    title: Retire product content
    description: Retire product names and descriptions.
    upstream: { method: POST, path: /V1/products/bulk }
    input_schema:
      type: object
      properties:
        brand: { type: string }
        skus: { type: array, items: { type: string } }
        changes:
          type: object
          properties: { name: { type: string }, description: { type: string } }
          additionalProperties: false
          minProperties: 1
      required: [brand, changes]
      additionalProperties: false
    manifest:
      id_field: sku
      ids_arg: skus
      values_arg: changes
      fields: [name, description]
      scope_args: { brand: brand }
      read_before:
        operation: shop.get_products
        ids_arg: skus
        args: { brand: { arg: brand } }
      selector:
        operation: shop.search_products
        args: { brand: { arg: brand } }
        page_arg: page
        page_size_arg: page_size
      rollback: { strategy: replay_previous_state }
