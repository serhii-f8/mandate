version: 1
roles:
  - id: content_manager
    grants:
      - operation: shop.post_note
    # POL-5: an opaque call has no record count, so above_threshold never waives it.
    approval: { required: above_threshold, record_threshold: 25, steps: [{ role: content_lead }] }
  - id: content_lead
    grants: []
role_mapping:
  - { group: content, roles: [content_manager] }
  - { group: content-leads, roles: [content_lead] }
