version: 1
operations:
  - id: shop.upload_image
    connection: shop
    risk: write_opaque
    description: Upload an image to the shop.
    upstream:
      method: POST
      path: /V1/media
      body: { arg: image }
    input_schema:
      type: object
      properties: { image: { type: string, format: uuid } }
      required: [image]
      additionalProperties: false
    files:
      - { at: /image, send: base64, media_types: [image/png, application/json, text/csv, text/plain] }
  - id: shop.post_note
    connection: shop
    risk: write_opaque
    description: Post a note.
    upstream: { method: POST, path: /V1/notes, body: { arg: note } }
    input_schema:
      type: object
      properties: { note: { type: string } }
      required: [note]
