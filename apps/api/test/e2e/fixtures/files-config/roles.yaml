version: 1
roles:
  - id: editor
    grants:
      - operation: shop.upload_image
    approval: { required: always, steps: [{ role: lead }] }
  - id: lead
    grants: []
  - id: viewer
    grants:
      - operation: shop.post_note
    approval: { required: never }
role_mapping:
  - { group: editors, roles: [editor] }
  - { group: viewers, roles: [viewer] }
  - { group: leads, roles: [lead] }
