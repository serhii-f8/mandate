version: 1
roles:
  - id: content_manager
    grants:
      - operation: shop.update_content
        id: own-brands
        scope: { brand: [acme, globex] }
    # Phase 5 starts execution only for roles that need no approval (MCP-8, POL-6).
    approval: { required: never }
role_mapping:
  - group: content
    roles: [content_manager]
