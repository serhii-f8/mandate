version: 1
notifications:
  - { id: ops-chat, kind: webhook, url_credential_ref: ops-chat-webhook, allowed_hosts: [hooks.example.test] }
roles:
  - id: integration_admin
    grants: []
    manage_credentials: [shop-token, ops-chat-webhook]
  - id: platform_admin
    grants: []
    manage_credentials: ['*']
  - id: support_agent
    grants:
      - operation: catalog.search_products
role_mapping:
  - group: admins
    roles: [integration_admin]
  - group: platform
    roles: [platform_admin]
  - group: support
    roles: [support_agent]
