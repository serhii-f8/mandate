# MCP upstream e2e (CONN-1, CONN-4, SEC-5, SEC-6). The test replaces __MCP_URL__ with the fake MCP server's URL.
version: 1
connections:
  - id: tools
    adapter: mcp
    mcp_url: __MCP_URL__
    allow_private_network: true
    pin_check_seconds: 10
    timeout_ms: 2000
    retry: { max_attempts: 1 }
