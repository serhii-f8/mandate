version: 1
operations:
  - id: catalog.search_products
    connection: shop
    risk: read
    title: Search products
    description: Search the catalog by brand.
    upstream:
      method: GET
      path: /V1/products
      query: { brand: { arg: brand } }
      response: { items: items, total: total_count, fields_from_arg: fields }
    input_schema:
      type: object
      properties:
        brand: { type: string }
        fields: { type: array, items: { type: string } }
      required: [fields]
      additionalProperties: false
    fields_arg: fields
  - id: catalog.get_products
    connection: shop
    risk: read
    description: Products by SKU, for the preparation of a change.
    upstream:
      method: GET
      path: /V1/products
      query: { skus: { arg: skus, join: ',' }, brand: { arg: brand } }
      response: { items: items, total: total_count, fields_from_arg: fields }
    input_schema:
      type: object
      properties:
        skus: { type: array, items: { type: string } }
        brand: { type: string }
        fields: { type: array, items: { type: string } }
      required: [skus, fields]
      additionalProperties: false
    fields_arg: fields
  - id: catalog.update_content
    connection: shop
    risk: write
    title: Update product content
    description: Change product names.
    upstream: { method: POST, path: /V1/products/bulk }
    input_schema:
      type: object
      properties:
        brand: { type: string }
        skus: { type: array, items: { type: string } }
        changes:
          type: object
          properties: { name: { type: string } }
          additionalProperties: false
          minProperties: 1
      required: [brand, skus, changes]
      additionalProperties: false
    manifest:
      id_field: sku
      ids_arg: skus
      values_arg: changes
      fields: [name]
      scope_args: { brand: brand }
      read_before:
        operation: catalog.get_products
        ids_arg: skus
        args: { brand: { arg: brand } }
      rollback: { strategy: replay_previous_state }
