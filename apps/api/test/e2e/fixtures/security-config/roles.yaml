version: 1
roles:
  - id: scoped
    grants:
      - operation: catalog.search_products
        id: acme-only
        scope: { brand: [acme] }
        deny_fields: [cost]
  - id: allowlisted
    grants:
      - operation: catalog.search_products
        id: name-and-description
        allow_fields: [name, description]
  - id: nogrant
    grants: []
role_mapping:
  - group: scoped
    roles: [scoped]
  - group: allowlisted
    roles: [allowlisted]
  - group: nogrant
    roles: [nogrant]
