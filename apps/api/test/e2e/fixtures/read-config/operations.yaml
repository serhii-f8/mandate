version: 1
operations:
  - id: catalog.search_products
    connection: shop
    risk: read
    title: Search products
    description: Search the catalog by brand.
    upstream:
      method: GET
      path: /V1/products
      query: { brand: { arg: brand } }
      response: { items: items, total: total_count, fields_from_arg: fields }
    input_schema:
      type: object
      properties:
        brand: { type: string }
        fields: { type: array, items: { type: string } }
      required: [brand, fields]
      additionalProperties: false
    fields_arg: fields
  - id: support.lookup_order
    connection: shop
    risk: read
    description: Look up an order by its number.
    upstream:
      method: GET
      path: '/V1/orders/{order_number}'
      path_params: { order_number: { arg: order_number } }
    input_schema:
      type: object
      properties: { order_number: { type: string, minLength: 1 } }
      required: [order_number]
      additionalProperties: false
  - id: catalog.update_product
    connection: shop
    risk: write_opaque
    description: Update a product.
    upstream:
      method: PUT
      path: '/V1/products/{sku}'
      path_params: { sku: { arg: sku } }
    input_schema:
      type: object
      properties: { sku: { type: string } }
      required: [sku]
      additionalProperties: false
