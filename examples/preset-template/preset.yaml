# Preset template 1.3.0 (CONN-8, OPS-2, OPS-3, OPS-6). Copy this directory, rename the package,
# replace the spec and the operations, and keep the contract test green (NFR-17).
# Bind it to an openapi connection:   base_url: https://notes.example.com/api
version: 1
spec: spec/notes.openapi.json
auth: { scheme: bearer }
test: { operation: notes.search, args: { fields: [id], page_size: 1 } }
# Parameters (CONN-8): a connection may set them with `preset_params`; `{ $param: <name> }` below
# is replaced by the connection's value, or by the default, before the operations are checked.
params:
  search_fields:
    type: string_list
    default: [id, title, body, updated_at]
    description: Note fields notes.search may return.
operations:
  # A read: also serves as the manifest's read_before, so it takes an optional `ids` array.
  - id: notes.search
    risk: read
    title: Search notes
    description: Search notes by title, or fetch some by id. Returns only the requested fields.
    input_schema:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Note ids (exact match, no commas).
          items: { type: string, minLength: 1, maxLength: 64, pattern: '^[^,]+$' }
        q:
          type: string
          minLength: 1
          maxLength: 255
          description: Title contains this text.
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          description: Note fields to return.
          items: { type: string, enum: { $param: search_fields } }
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      required: [fields]
      additionalProperties: false
    fields_arg: fields
    upstream:
      method: GET
      path: /notes
      query:
        ids: { arg: ids, join: ',' }
        q: { arg: q }
        page_size: { arg: page_size, default: 20 }
      response: { items: items, total: total, fields_from_arg: fields, max_items: 100 }
  # A write with a manifest: one PATCH per record; the change-set holds before and after (OPS-2).
  - id: notes.update_title
    risk: write
    title: Update note titles
    description: Change the title of notes. Prepared as a change-set for approval; nothing is written until approved.
    input_schema:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Note ids to change (no commas).
          items: { type: string, minLength: 1, maxLength: 64, pattern: '^[^,]+$' }
        changes:
          type: object
          minProperties: 1
          additionalProperties: false
          description: Field to new value.
          properties:
            title: { type: string, minLength: 1, maxLength: 255 }
      required: [ids, changes]
      additionalProperties: false
    upstream:
      method: PATCH
      path: /notes/{id}
      path_params: { id: { record: id } }
    manifest:
      id_field: id
      ids_arg: ids
      values_arg: changes
      fields: [title]
      read_before: { operation: notes.search, ids_arg: ids }
      batch_size: 100
      max_targets: 1000
      rollback: { strategy: replay_previous_state }
      # A check (CS-3, since 1.2.0): a note that has no title yet is left out of the change-set with this code.
      checks:
        - code: empty_title
          title: The note has no title yet
          require: [{ present: { before: title } }]
      # Verify after (EXE-12, since 1.3.0): once the last batch is written, read the notes again and
      # confirm each one whose title shows the written value. Looks every 10 seconds (the minimum)
      # for up to a minute; a note that still differs then is reported as not confirmed.
      verify_after:
        every_seconds: 10
        timeout_seconds: 60
        checks:
          - code: title_not_updated
            title: The note does not show the new title yet
            require: [{ equals: [{ record: title }, { after: title }] }]
  # A create (OPS-2, since 1.2.0): each record carries its own values. A note that already exists is
  # left out (already_exists); the rollback deletes what was created, through notes.delete.
  - id: notes.create
    risk: write
    title: Create notes
    description: Create notes with an id, a title and an optional body. Prepared as a change-set for approval; nothing is written until approved.
    input_schema:
      type: object
      properties:
        notes:
          type: array
          minItems: 1
          maxItems: 1000
          description: The notes to create.
          items:
            type: object
            properties:
              id: { type: string, minLength: 1, maxLength: 64, pattern: '^[^,]+$' }
              title: { type: string, minLength: 1, maxLength: 255 }
              body: { type: string, maxLength: 10000 }
            required: [id, title]
            additionalProperties: false
      required: [notes]
      additionalProperties: false
    upstream:
      method: POST
      path: /notes
    manifest:
      action: create
      id_field: id
      records_arg: notes
      fields: [title, body]
      required_fields: [title]
      read_before: { operation: notes.search, ids_arg: ids }
      batch_size: 100
      max_targets: 1000
      rollback: { strategy: inverse_operation, operation: notes.delete }
  # A delete (OPS-2, since 1.2.0): destructive, so it always needs approval with step-up. The change-set
  # keeps the title and body of every note; the rollback re-creates them through notes.create.
  - id: notes.delete
    risk: destructive
    title: Delete notes
    description: Delete notes by id. Prepared as a change-set that shows what is deleted; nothing is deleted until approved.
    input_schema:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Note ids to delete (no commas).
          items: { type: string, minLength: 1, maxLength: 64, pattern: '^[^,]+$' }
      required: [ids]
      additionalProperties: false
    upstream:
      method: DELETE
      path: /notes/{id}
      path_params: { id: { record: id } }
    manifest:
      action: delete
      id_field: id
      ids_arg: ids
      fields: [title, body]
      read_before: { operation: notes.search, ids_arg: ids }
      batch_size: 100
      max_targets: 1000
      rollback: { strategy: inverse_operation, operation: notes.create }
