# yaml-language-server: $schema=../../packages/config/schema/mandate-config.v1.json
# Service accounts: OAuth clients that call without a person (AUTH-4). Each has exactly one role.
version: 1

service_accounts:
  # The client ID (the token's azp claim).
  - client_id: content-sync-bot
    role: content_manager
    description: Nightly content synchronisation job.
    # Overrides rate_limits.mcp_service_account_per_minute for this client (SEC-10).
    rate_limit_per_minute: 1000
