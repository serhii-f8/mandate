# Dependency audit allowlist (SEC-11), read by tooling/security/audit-gate.mjs.
# Each entry: a list item with these fields, all required.
#   id:      the GitHub advisory id, for example GHSA-xxxx-xxxx-xxxx
#   package: the affected package name
#   reason:  why the advisory is accepted (for example dev-only, not shipped in images)
#   expires: YYYY-MM-DD, at most 90 days after the day the gate runs; renew deliberately
# An expired entry, or one that matches no current advisory, fails the gate.
- id: GHSA-8988-4f7v-96qf
  package: '@opentelemetry/core'
  reason: >-
    1.30.1 is a dependency of @temporalio/interceptors-opentelemetry (^1.25.1, also in 1.26.0), so
    no 2.x override fits; our own packages run 2.12.0. The flaw is in W3C baggage extraction, which
    only the plugin's workflow tracer runs, on _tracer-data headers written by our api and worker,
    whose global propagator injects W3C trace context only (ADR 0047, ADR 0054).
  expires: '2027-02-18'
- id: GHSA-67mh-4wv8-2f99
  package: esbuild
  reason: >-
    Dev-only: drizzle-kit (devDependency of packages/db, used by db:generate) pins
    @esbuild-kit/core-utils, which requires esbuild ~0.18.20, so a patched >=0.25 does not fit its
    range. The flaw is in esbuild's serve mode, which drizzle-kit never starts; not in any image.
  expires: '2027-02-18'
- id: GHSA-3g3m-2fjr-6pw4
  package: glob
  reason: >-
    Test-only: testcontainers > archiver > archiver-utils requires glob ^10.0.0, so a patched
    >=14.0.2 does not fit its range. Reached only by Testcontainers in integration tests; not in
    any image.
  expires: '2027-02-18'
- id: GHSA-g3hv-75wg-m249
  package: minimatch
  reason: >-
    Test-only: glob 10 (via testcontainers > archiver) requires minimatch ^9.0.4, so a patched
    >=11.0.1 does not fit its range. Patterns come from Testcontainers itself, not from input; not
    in any image.
  expires: '2027-02-18'
