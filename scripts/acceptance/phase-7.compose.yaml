# Compose override of the Phase 7 acceptance (scripts/acceptance/phase-7.sh).
# The api and the worker join the Magento sandbox's external network (deploy/sandbox/magento, alias
# `magento-sandbox`) and read the generated acceptance configuration instead of deploy/config.
# One worker: the run is about the widgets, the text fallback and the export, not about killing workers.
#   AIOPS_ACCEPT_CONFIG_DIR   absolute path of the generated configuration directory
services:
  api:
    networks: [default, sandbox]
    volumes:
      - ${AIOPS_ACCEPT_CONFIG_DIR:?set AIOPS_ACCEPT_CONFIG_DIR}:/etc/aiops/config:ro
  # Preparation and execution run in the worker (ADR 0027); it follows applied revisions like the api.
  worker:
    networks: [default, sandbox]
    volumes:
      - ${AIOPS_ACCEPT_CONFIG_DIR:?set AIOPS_ACCEPT_CONFIG_DIR}:/etc/aiops/config:ro

networks:
  sandbox:
    external: true
    name: aiops-sandbox
