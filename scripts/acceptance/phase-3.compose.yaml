# Compose override of the Phase 3 acceptance (scripts/acceptance/phase-3.sh, design part 1 §7).
# The api joins the Magento sandbox's external network (deploy/sandbox/magento, alias
# `magento-sandbox`) and reads the generated acceptance configuration instead of deploy/config.
#   AIOPS_ACCEPT_CONFIG_DIR   absolute path of the generated configuration directory
services:
  api:
    networks: [default, sandbox]
    volumes:
      - ${AIOPS_ACCEPT_CONFIG_DIR:?set AIOPS_ACCEPT_CONFIG_DIR}:/etc/aiops/config:ro

networks:
  sandbox:
    external: true
    name: aiops-sandbox
