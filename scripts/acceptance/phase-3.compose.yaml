# Compose override of the Phase 3 acceptance (scripts/acceptance/phase-3.sh, design part 1 §7).
# The api and the worker join the Magento sandbox's external network (deploy/sandbox/magento, alias
# `magento-sandbox`) and read the generated acceptance configuration instead of deploy/config.
#   MANDATE_ACCEPT_CONFIG_DIR   absolute path of the generated configuration directory
services:
  api:
    networks: [default, sandbox]
    volumes:
      - ${MANDATE_ACCEPT_CONFIG_DIR:?set MANDATE_ACCEPT_CONFIG_DIR}:/etc/mandate/config:ro
  # Preparation and execution run in the worker (ADR 0027): it reads and writes the sandbox.
  worker:
    networks: [default, sandbox]
    volumes:
      - ${MANDATE_ACCEPT_CONFIG_DIR:?set MANDATE_ACCEPT_CONFIG_DIR}:/etc/mandate/config:ro

networks:
  sandbox:
    external: true
    name: mandate-sandbox
