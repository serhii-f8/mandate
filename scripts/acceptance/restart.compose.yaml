# Compose override of the restart acceptance (scripts/acceptance/restart.sh, NFR-1).
# The api and the worker read the generated restart configuration instead of deploy/config; two
# worker replicas, so killing the worker service kills every worker (NFR-4). The fake Magento
# catalog of packages/testing runs on the project network as `fake-magento`; its control routes
# (/_control/*) are published on 127.0.0.1 for the script.
#   MANDATE_ACCEPT_CONFIG_DIR     absolute path of the generated configuration directory
#   MANDATE_FAKE_MAGENTO_PORT     host port (127.0.0.1) of the fake's routes
services:
  api:
    volumes:
      - ${MANDATE_ACCEPT_CONFIG_DIR:?set MANDATE_ACCEPT_CONFIG_DIR}:/etc/mandate/config:ro
  worker:
    volumes:
      - ${MANDATE_ACCEPT_CONFIG_DIR:?set MANDATE_ACCEPT_CONFIG_DIR}:/etc/mandate/config:ro
    deploy:
      replicas: 2

  fake-magento:
    build:
      context: .
      dockerfile: tooling/acceptance/fake-magento.Dockerfile
    environment:
      PORT: "3003"
      # SKUs 1-1500 are the groups' ranges (baseline 1-100, kill groups 300 each, pending 100 each);
      # the rest stay untouched, so "no SKU outside the change-set changed" has controls.
      PRODUCTS: "1600"
    ports:
      - "127.0.0.1:${MANDATE_FAKE_MAGENTO_PORT:?set MANDATE_FAKE_MAGENTO_PORT}:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3003,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      retries: 60
