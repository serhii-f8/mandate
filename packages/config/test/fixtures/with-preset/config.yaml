version: 1
presets:
  - { id: fake, package: "@aiops/fake-preset", version: "0.1.0" }
connections:
  - id: shop
    adapter: openapi
    base_url: https://shop.example.test/api
    credential_ref: shop-token
    preset: fake
roles:
  - id: viewer
    grants:
      - { operation: fake.search_items, scope: { brand: [acme] } }
  - id: integration_admin
    grants: []
    manage_credentials: [shop-token]
role_mapping:
  - { group: viewers, roles: [viewer] }
