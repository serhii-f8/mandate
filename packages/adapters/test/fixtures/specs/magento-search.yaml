# Magento-shaped product search (Swagger 2.0, YAML), trimmed for adapter tests.
swagger: '2.0'
info:
  title: Mini Magento catalog
  version: '2.4'
basePath: /rest/default
paths:
  /V1/products:
    get:
      operationId: catalogProductRepositoryV1GetListGet
      summary: Get product list
      produces:
        - application/json
      parameters:
        - name: searchCriteria[pageSize]
          in: query
          type: integer
          required: false
        - name: searchCriteria[filterGroups][0][filters][0][field]
          in: query
          type: string
          required: false
        - name: searchCriteria[filterGroups][0][filters][0][value]
          in: query
          type: string
          required: false
      responses:
        '200':
          description: ok
