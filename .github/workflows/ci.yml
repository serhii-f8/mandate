name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  dependency-scan:
    name: dependency audit gate (SEC-11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/dependency-scan.sh

  ci:
    if: github.event_name != 'schedule'
    name: lint, type-check, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: bash scripts/ci.sh

  compose:
    if: github.event_name != 'schedule'
    name: Compose stack acceptance (Phases 1 and 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/acceptance/phase-1.sh
      - run: bash scripts/acceptance/phase-2.sh

  restart:
    if: github.event_name != 'schedule'
    name: restart acceptance (NFR-1, NFR-2, NFR-4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/acceptance/restart.sh
