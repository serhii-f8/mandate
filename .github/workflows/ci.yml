name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: lint, type-check, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: bash scripts/ci.sh

  compose:
    name: Compose stack acceptance (Phases 1 and 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/acceptance/phase-1.sh
      - run: bash scripts/acceptance/phase-2.sh
