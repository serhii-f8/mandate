# Magento 2 catalog preset 0.2.0 (CONN-8, OPS-2, OPS-4; ADR 0007: scope `all`; Phase 4 design §8).
# Bind it to an openapi connection whose base_url ends in /rest/all, for example
#   base_url: http://magento-sandbox/rest/all
# The read operations use GET /V1/products with search criteria. The brand filter is always
# filter group 0, so a grant scoped by brand holds upstream without a pre-read; a product of
# another brand is simply not found. Items are flattened (custom_attributes) and projected to
# exactly the requested `fields`, so a field nobody asked for (e.g. cost) is never returned.
version: 1
spec: spec/magento2-catalog.swagger.json
auth: { scheme: bearer }
test: { operation: catalog.search_products, args: { brand: acme, fields: [sku], page_size: 1 } }
operations:
  - id: catalog.search_products
    risk: read
    title: Search products
    description: >-
      Search the catalog for products of one brand, optionally by name pattern. Returns only
      the requested fields of each product, at most 100 per page.
    input_schema:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 128
          description: The product brand (exact match).
        fields: &fields
          type: array
          minItems: 1
          uniqueItems: true
          description: Product fields to return.
          items:
            type: string
            enum: [sku, name, price, status, visibility, type_id, description, short_description, brand, cost, url_key, meta_title, meta_keyword, meta_description, updated_at]
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Products per page (1-100, default 20).
        current_page:
          type: integer
          minimum: 1
          description: Page number, starting at 1 (default 1).
        name_like:
          type: string
          minLength: 1
          maxLength: 255
          description: Product name pattern; use % as wildcard, e.g. %lamp% (default %, any name).
      required: [brand, fields]
      additionalProperties: false
    fields_arg: fields
    upstream:
      method: GET
      path: /V1/products
      query:
        searchCriteria[filter_groups][0][filters][0][field]: brand
        searchCriteria[filter_groups][0][filters][0][value]: { arg: brand }
        searchCriteria[filter_groups][0][filters][0][condition_type]: eq
        # Template values cannot concatenate, so the caller passes the whole LIKE pattern.
        # Without one the pattern is % (every name), which keeps the filter group well formed.
        searchCriteria[filter_groups][1][filters][0][field]: name
        searchCriteria[filter_groups][1][filters][0][value]: { arg: name_like, default: '%' }
        searchCriteria[filter_groups][1][filters][0][condition_type]: like
        # A stable order keeps selector pages from overlapping or skipping (OPS-4).
        searchCriteria[sortOrders][0][field]: sku
        searchCriteria[sortOrders][0][direction]: ASC
        searchCriteria[pageSize]: { arg: page_size, default: 20 }
        searchCriteria[currentPage]: { arg: current_page, default: 1 }
      response: &response
        items: items
        total: total_count
        flatten: { path: custom_attributes, key: attribute_code, value: value }
        fields_from_arg: fields
        max_items: 100
  - id: catalog.get_product
    risk: read
    title: Get a product
    description: >-
      Look up one product of a brand by SKU. A SKU of another brand is not found. Returns
      only the requested fields.
    input_schema:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 128
          description: The product brand (exact match).
        sku:
          type: string
          minLength: 1
          maxLength: 64
          description: The product SKU (exact match).
        fields: *fields
      required: [brand, sku, fields]
      additionalProperties: false
    fields_arg: fields
    upstream:
      method: GET
      path: /V1/products
      query:
        searchCriteria[filter_groups][0][filters][0][field]: brand
        searchCriteria[filter_groups][0][filters][0][value]: { arg: brand }
        searchCriteria[filter_groups][0][filters][0][condition_type]: eq
        searchCriteria[filter_groups][1][filters][0][field]: sku
        searchCriteria[filter_groups][1][filters][0][value]: { arg: sku }
        searchCriteria[filter_groups][1][filters][0][condition_type]: eq
        searchCriteria[pageSize]: 1
      response: *response
  - id: catalog.get_products_by_sku
    risk: read
    title: Get products by SKU
    description: >-
      Look up up to 100 products of one brand by SKU in one call. SKUs of another brand are
      not found. SKUs containing a comma are not supported. Returns only the requested fields.
    input_schema:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 128
          description: The product brand (exact match).
        skus:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Product SKUs (exact match, no commas).
          items: &sku
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[^,]+$'
        fields: *fields
      required: [brand, skus, fields]
      additionalProperties: false
    fields_arg: fields
    upstream:
      method: GET
      path: /V1/products
      query:
        searchCriteria[filter_groups][0][filters][0][field]: brand
        searchCriteria[filter_groups][0][filters][0][value]: { arg: brand }
        searchCriteria[filter_groups][0][filters][0][condition_type]: eq
        # Magento's `in` takes a comma-separated list (ADR 0024).
        searchCriteria[filter_groups][1][filters][0][field]: sku
        searchCriteria[filter_groups][1][filters][0][value]: { arg: skus, join: ',' }
        searchCriteria[filter_groups][1][filters][0][condition_type]: in
        searchCriteria[pageSize]: 100
      response: *response
  - id: catalog.update_content
    risk: write
    title: Update product content
    description: >-
      Change content fields (name, descriptions, meta data, URL key) of products of one brand.
      Name the products by SKU (up to 1000) or select them with a name pattern. The change is
      prepared as a change-set for approval; nothing is written upstream until it is approved.
    input_schema:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 128
          description: The product brand (exact match).
        skus:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Product SKUs to change (no commas). Give either skus or name_like, not both.
          items: *sku
        name_like:
          type: string
          minLength: 1
          maxLength: 255
          description: Select products by name pattern (% wildcard) instead of skus; "%" selects the whole brand.
        changes:
          type: object
          minProperties: 1
          additionalProperties: false
          description: Field to new value.
          properties:
            name: { type: string, maxLength: 65535 }
            description: { type: string, maxLength: 65535 }
            short_description: { type: string, maxLength: 65535 }
            meta_title: { type: string, maxLength: 65535 }
            meta_keyword: { type: string, maxLength: 65535 }
            meta_description: { type: string, maxLength: 65535 }
            url_key: { type: string, maxLength: 65535 }
      required: [brand, changes]
      additionalProperties: false
      # Exactly one of skus or name_like: with brand and changes required and no other
      # property allowed, three properties means one of the two (a whole brand takes
      # name_like "%" explicitly). Not anyOf/not at the root: Claude clients refuse a tool
      # whose input_schema has a top-level combinator (ADR 0026).
      minProperties: 3
      maxProperties: 3
    upstream: { method: POST, path: /async/bulk/V1/products }
    manifest:
      id_field: sku
      ids_arg: skus
      values_arg: changes
      fields: [name, description, short_description, meta_title, meta_keyword, meta_description, url_key]
      scope_args: { brand: brand }
      read_before:
        operation: catalog.get_products_by_sku
        ids_arg: skus
        args: { brand: { arg: brand } }
      selector:
        operation: catalog.search_products
        args: { brand: { arg: brand }, name_like: { arg: name_like } }
        page_arg: current_page
        page_size_arg: page_size
        page_size: 100
      batch_size: 100
      max_targets: 10000
      rollback: { strategy: replay_previous_state }
